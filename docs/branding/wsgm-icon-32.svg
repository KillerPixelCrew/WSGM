<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- 32 px source: the master's linework divides cleanly to 1 px strokes at
       this size, but its vector play mark antialiases to mud — so the geometry
       is the master ÷ 8 with the triangle rebuilt from whole pixels. -->
