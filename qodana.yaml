# Qodana for .NET. The workflow runs this natively on a Windows runner, because WSGM targets
# net10.0-windows and its build stages the Steam Input Lease (Rust) and VIIPER (Go with cgo)
# libraries from the submodules. eng/qodana-bootstrap.ps1 builds everything and writes the
# WSGM.Tests coverage report to .qodana/code-coverage, where Qodana reads it.
# The JavaScript, Python and C++ analyses use the configurations in .qodana/.
version: "1.0"
linter: qodana-dotnet
profile:
  name: qodana.recommended

dotnet:
  solution: WSGM.slnx
  configuration: Release

bootstrap: pwsh -NoLogo -NoProfile -File eng\qodana-bootstrap.ps1

exclude:
  - name: All
    paths:
      - _ref
      - external
      - node_modules
      - publish
      - src/WSGM/Native
      - src/WSGM.Plugin.Ir/Firmware/.pio
      - TestResults
  # Windows application manifests use the side-by-side assembly schema, which the XML
  # inspection does not know, so every element reads as undeclared.
  - name: XmlHighlighting
    paths:
      - src/WSGM/app.manifest
      - src/WSGM.Launch/app.manifest
      - src/WSGM.LogonService/app.manifest
