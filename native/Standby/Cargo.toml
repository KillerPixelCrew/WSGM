[workspace]
resolver = "3"
members = [
    "crates/standby-core",
    "crates/standby-ffi",
    "crates/standby-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
standby-core = { path = "crates/standby-core" }
windows-sys = "0.61.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
