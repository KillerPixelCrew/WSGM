[package]
name = "radio-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "radio_core"

[dependencies]
windows-core.workspace = true
windows-collections.workspace = true

[dependencies.windows]
workspace = true
features = [
    # WinRT: radio power state, and Bluetooth discovery/pairing.
    "Devices_Radios",
    "Devices_Enumeration",
    "Devices_Bluetooth",
    "Foundation",
    "Foundation_Collections",
    # Win32: the native WLAN API. WinRT's WiFiAdapter is unusable here because
    # RequestAccessAsync always returns DeniedBySystem without the wiFiControl
    # capability, which only a packaged app can declare.
    "Win32_NetworkManagement_WiFi",
    # WlanConnect and WLAN_CONNECTION_PARAMETERS are gated behind this one.
    "Win32_NetworkManagement_Ndis",
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_WinRT",
    # Bluetooth audio connect/disconnect: Core Audio endpoint topology plus the
    # kernel-streaming BtAudio one-shot properties.
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
    # Read-only: reports the privacy consent values that gate scan and toggle.
    "Win32_System_Registry",
    "Win32_Security",
]
