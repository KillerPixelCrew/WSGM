[package]
name = "radio-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
# Cargo requires a snake-case crate name; the build script stages the result as
# WSGM.Radio.dll, matching WSGM.VolumeControl.dll beside the executable.
name = "wsgm_radio"
# "lib" alongside the cdylib so the ABI helpers stay unit-testable; only the
# cdylib is shipped.
crate-type = ["cdylib", "lib"]

[dependencies]
radio-core.workspace = true
