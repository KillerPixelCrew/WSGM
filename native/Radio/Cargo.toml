[workspace]
resolver = "3"
members = [
    "crates/radio-core",
    "crates/radio-ffi",
    "crates/radio-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
radio-core = { path = "crates/radio-core" }
# The `windows` crate, NOT `windows-sys`: this subsystem needs WinRT
# (Windows.Devices.Radios / .Enumeration), and windows-sys projects raw Win32
# only — it has no COM or WinRT support at all. The Win32 half (wlanapi) comes
# from the same crate, so one dependency covers both halves of the ABI.
windows = "0.62"
windows-core = "0.62"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
