[package]
name = "wsgm-deelevate"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

# Steam launch-option wrapper that runs a game at MEDIUM integrity when WSGM has
# elevated Steam (some games/anti-cheat refuse to run elevated).
#
# NATIVE by design: a NativeAOT .NET wrapper dies before main() when Steam
# launches it (device-observed — a native game exe and a CoreCLR app both launch
# fine, only the NativeAOT one does not). The de-elevation itself is unchanged
# from the previous C# helper: the linked-token route fails (1346), so the
# elevated parent runs a one-shot scheduled task (InteractiveToken, no RunLevel)
# whose medium child launches the game with Steam's environment, handed over a
# per-launch named pipe that also carries the lifetime (parent death -> kill the
# game; game exit -> report the code).
[[bin]]
name = "wsgm-deelevate"
path = "src/main.rs"

[dependencies.windows-sys]
version = "0.59"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_System_SystemInformation",
    # ReadFile/WriteFile/ConnectNamedPipe take an OVERLAPPED* (we pass null).
    "Win32_System_IO",
]

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
