# Project-scoped Codex configuration. Codex loads this only for a TRUSTED project directory; if the
# server never appears, trust the directory rather than debugging the config.
#
# Attaches Chrome DevTools MCP to Steam's CEF instead of launching a browser. The port is the same
# loopback CDP endpoint WSGM itself drives, opened by Steam's `.cef-enable-remote-debugging` flag —
# see docs\steam-cef.md for the accepted security posture, and never remove that flag.
#
# Before starting or invoking this server, read the current Steam run's logs and confirm Steam
# AND Big Picture have fully started. Even list_pages/target discovery must wait. Attaching early
# can hang the entire Steam UI and leave Steam requiring force-close; that is not permission to
# terminate it. Missing or ambiguous evidence means stay disconnected and continue offline.
# See .agents/skills/wsgm-steam-cef-debugging/references/live-tools.md for the ordered preflight.
#
# After startup-log confirmation, prove Steam owns the loopback listener and validate target URLs.
# SharedJSContext owns the stores, webpack runtime and bridge. Visible DOM belongs to MainWindow,
# selected by about:blank? URL shape with createflags/minwidth and without openerid/browserviewpopup,
# never by a localized title. Only then list_pages/select_page for the confirmed target.
#
# close_page closes a real Steam window and must never be used as generic cleanup.

[mcp_servers.steam-cef]
command = "cmd"
args = [
  "/c",
  "npx",
  "-y",
  "chrome-devtools-mcp@1.8.0",
  "--browserUrl",
  "http://127.0.0.1:8080",
  "--usageStatistics",
  "false",
  "--performanceCrux",
  "false",
]
startup_timeout_sec = 60
