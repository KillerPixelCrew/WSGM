version: 2
updates:
  # The projects live below src/ and tests/ and are listed only in WSGM.slnx. Name the project
  # directories explicitly; scanning "/" alone found no NuGet manifests to update.
  - package-ecosystem: "nuget"
    directories:
      - "/src/*"
      - "/tests/*"
    schedule:
      interval: "weekly"
    groups:
      nuget-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-all:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/external/steam-input-lease"
    schedule:
      interval: "weekly"
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
