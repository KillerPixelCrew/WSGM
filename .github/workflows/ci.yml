name: Validate

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

# A superseded push must not keep a full Windows verify (Rust clippy + tests +
# Release build + coverage) or a Qodana scan running: cancel it and let the newest ref decide.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The reusable libraries, Steam Input, and VIIPER are submodules. Device projects
          # and their shared SDK are ordinary source in this checkout.
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # verify.ps1 builds the Steam Input Lease library from the
      # external/steam-input-lease submodule and runs its clippy/test gates, so the runner needs a
      # Rust toolchain with clippy. windows-latest ships rustup already.
      - name: Add Rust clippy component
        shell: pwsh
        run: rustup component add clippy

      # The device platform adds isolated runtime, tooling, plugin, and test projects, so a cold
      # NuGet restore is a meaningful part of the run. Keyed on the project
      # files because this repository pins versions in the csproj rather than in a
      # packages.lock.json, which is what setup-dotnet's own caching would need.
      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The Steam Input workspace is built by verify.ps1, so its registry,
      # checkout, target directory, and lockfile participate in the cache.
      - name: Cache Rust build output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            external/steam-input-lease/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('external/steam-input-lease/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Lint, format, build, test, and collect coverage
        shell: pwsh
        run: ./eng/verify.ps1

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results-and-coverage
          path: TestResults
          if-no-files-found: warn

      # The Qodana .NET job builds against this staged library instead of rebuilding Rust.
      - name: Upload staged Steam Input Lease
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-steam-input-lease
          path: src/WSGM/Native/SteamInputLease
          if-no-files-found: error
          retention-days: 1

  # verify.ps1 deliberately does not build or validate VIIPER (see eng/CLAUDE.md), so without
  # this job a broken pin stayed green here and failed only inside the tag-triggered release
  # job, after a public tag already existed.
  viiper:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      # setup-go caches the module download and build caches, keyed on the VIIPER go.sum.
      - name: Set up Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: external/viiper/go.mod
          cache: true
          cache-dependency-path: external/viiper/go.sum

      # The library exposes a C ABI, so cgo needs a C compiler. build-viiper.ps1 only looks on PATH
      # and under a winget install location. windows-latest ships MinGW-w64 in C:\mingw64; the
      # Chocolatey install is only a fallback for an image without it.
      - name: Provide a C compiler for cgo
        shell: pwsh
        run: |
          if (Get-Command gcc -ErrorAction SilentlyContinue) { return }
          if (Test-Path 'C:\mingw64\bin\gcc.exe') {
              Add-Content -Path $env:GITHUB_PATH -Value 'C:\mingw64\bin'
              return
          }
          choco install mingw --no-progress -y
          $gcc = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\tools\mingw64' `
              -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe not found after installing mingw" }
          Add-Content -Path $env:GITHUB_PATH -Value $gcc.DirectoryName

      - name: Build and test VIIPER
        shell: pwsh
        run: ./eng/build-viiper.ps1 -Validate

      # The Qodana .NET job builds against this staged library instead of rebuilding Go.
      - name: Upload staged VIIPER
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-viiper
          path: src/WSGM/Native/Viiper
          if-no-files-found: error
          retention-days: 1

  # Qodana runs only after the gate passed, and only for pull requests, pushes to master and manual
  # runs, so a branch push that later becomes a pull request is not scanned twice.
  #
  # WSGM targets net10.0-windows, so the .NET analysis runs natively on Windows. qodana.yaml runs
  # eng/qodana-bootstrap.ps1, which here reuses the native libraries and the WSGM.Tests coverage
  # from the jobs above and only restores and builds the solution.
  qodana-dotnet:
    needs: [verify, viiper]
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      checks: write
    env:
      WSGM_QODANA_USE_STAGED_NATIVE: "1"
      WSGM_QODANA_COVERAGE_FROM: ${{ github.workspace }}\TestResults
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the pull request commit rather than the merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # Pull request analysis needs the full history.
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', 'Directory.Build.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Download staged Steam Input Lease
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-steam-input-lease
          path: src/WSGM/Native/SteamInputLease

      - name: Download staged VIIPER
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-viiper
          path: src/WSGM/Native/Viiper

      - name: Download WSGM.Tests coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: test-results-and-coverage
          path: TestResults

      - name: Qodana scan
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          # The baseline holds the reviewed findings that stay (see _plan/qodana-review-2.0.md);
          # only findings new against it count.
          args:
            --linter qodana-dotnet --within-docker false --baseline
            .qodana/dotnet-baseline.sarif.json
          pr-mode: false
          artifact-name: qodana-dotnet
          primary-cache-key: qodana-2026.2-dotnet-${{ github.ref }}-${{ github.sha }}
          # A prefix, so a pull request can restore the latest master cache.
          additional-cache-key: qodana-2026.2-dotnet-
          use-caches: true
          # Pull requests restore the master cache but do not store their own.
          cache-default-branch-only: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: "https://qodana.cloud"

  # The remaining languages each have their own configuration under .qodana/.
  qodana:
    needs: [verify]
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: js
            args: --config .qodana/js.yaml --linter qodana-js --within-docker false
          - name: python
            args: >-
              --config .qodana/python.yaml --linter qodana-python-community --within-docker false
          # qodana-clang runs only in a container. The privileged image lets the bootstrap install
          # PlatformIO.
          - name: clang
            args:
              --config .qodana/clang.yaml --image jetbrains/qodana-clang:2026.2-clang18-privileged
    name: qodana-${{ matrix.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      # The bootstrap in .qodana/js.yaml runs npm ci natively, which uses the npm cache.
      - name: Set up Node.js
        if: matrix.name == 'js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      # .qodana/clang.yaml installs PlatformIO, the ESP32-C3 toolchain and the firmware libraries
      # into .qodana/platformio inside the project the container mounts.
      - name: Cache PlatformIO
        if: matrix.name == 'clang'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .qodana/platformio
          key:
            ${{ runner.os }}-platformio-${{ hashFiles('src/WSGM.Plugin.Ir/Firmware/platformio.ini',
            '.qodana/clang.yaml') }}
          restore-keys: ${{ runner.os }}-platformio-

      - name: Qodana scan
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          args: ${{ matrix.args }}
          pr-mode: false
          artifact-name: qodana-${{ matrix.name }}
          primary-cache-key: qodana-2026.2-${{ matrix.name }}-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-${{ matrix.name }}-
          use-caches: true
          cache-default-branch-only: true
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: "https://qodana.cloud"
