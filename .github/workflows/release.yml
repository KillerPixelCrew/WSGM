name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Community plugins are built from third-party source, so the bundle is made in a job
  # that holds no write token and handed to the release job as an artifact.
  bundle:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: false
          persist-credentials: false

      - name: Check out build submodules
        shell: pwsh
        run:
          git submodule update --init --recursive -- external/steam-input-lease
          external/steam-ui-toolkit external/viiper external/windows-device-control

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      # The tag name goes through env, never spliced into script source (script-injection hardening).
      - name: Stamp version from tag
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: ./eng/stamp-version.ps1 -Tag $env:REF_NAME

      - name: Build the plugin bundle
        shell: pwsh
        run: ./eng/build-bundle.ps1 -OutputRoot publish/bundle -SkipTools

      - name: Upload the bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle
          path: publish/bundle

  release:
    needs: bundle
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Initialize build dependencies explicitly; LibHandheld remains inventory-only.
          submodules: false
          # Full history: the fourth version part is the commit count (eng/wsgm-revision.targets).
          fetch-depth: 0

      - name: Check out build submodules
        shell: pwsh
        run:
          git submodule update --init --recursive -- external/steam-input-lease
          external/steam-ui-toolkit external/viiper external/windows-device-control
          external/libgpu-driver-interact

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Add Rust clippy component
        shell: pwsh
        run: rustup component add clippy

      # Keep exe metadata, manifest identity and setup name in sync with the tag.
      - name: Stamp version from tag
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
        run: ./eng/stamp-version.ps1 -Tag $env:REF_NAME

      # A tag is not allowed to bypass the same source, generated-asset, Rust clippy, build, and
      # test gate used for ordinary pushes. build.ps1 repeats its release-specific staging checks.
      - name: Verify release source (including Rust clippy)
        shell: pwsh
        run: ./eng/verify.ps1

      # windows-latest ships the .NET SDK and native build tools, which is what
      # build.ps1 expects locally.
      - name: Download the plugin bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bundle
          path: bundle

      - name: Build (self-contained publish + setup)
        shell: pwsh
        run: .\build.ps1 -BundleFrom bundle

      - name: Hash the setup
        shell: pwsh
        run: |
          foreach ($setup in Get-ChildItem publish -Filter 'WSGM-Setup-*.exe') {
              $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              Set-Content -LiteralPath "$($setup.FullName).sha256" -Value "$hash  $($setup.Name)" -NoNewline
          }

      # No portable artifact: the logon service must be installed (Program Files +
      # SCM registration), so a zip that can't boot game mode would only mislead.
      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            publish/WSGM-Setup-*.exe
            publish/WSGM-Setup-*.exe.sha256
            publish/bundle.json
          generate_release_notes: true
