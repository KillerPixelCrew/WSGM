name: Qodana

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WSGM targets net10.0-windows and its build stages the Rust and Go libraries from the submodules,
  # so the .NET analysis runs natively on Windows with the same toolchains as ci.yml. qodana.yaml
  # runs eng/qodana-bootstrap.ps1, which builds the solution and collects WSGM.Tests coverage.
  dotnet:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Check out the pull request commit rather than the merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          # Pull request analysis needs the full history.
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Set up Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: external/viiper/go.mod

      # VIIPER exposes a C ABI, so cgo needs a C compiler. windows-latest already ships rustup for
      # Steam Input Lease.
      - name: Install a C compiler for cgo
        shell: pwsh
        run: |
          choco install mingw --no-progress -y
          $gcc = Get-ChildItem -Path 'C:\ProgramData\mingw64', 'C:\tools\mingw64' `
              -Recurse -Filter gcc.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $gcc) { throw "gcc.exe not found after installing mingw" }
          Add-Content -Path $env:GITHUB_PATH -Value $gcc.DirectoryName

      - name: Qodana scan
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          args: --linter qodana-dotnet --within-docker false
          pr-mode: false
          artifact-name: qodana-dotnet
          primary-cache-key: qodana-2026.2-dotnet-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-dotnet-${{ github.ref }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: "https://qodana.cloud"

  # The remaining languages each have their own configuration under .qodana/.
  other:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      checks: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: js
            args: --config .qodana/js.yaml --linter qodana-js --within-docker false
          - name: python
            args: >-
              --config .qodana/python.yaml --linter qodana-python-community --within-docker false
          # qodana-clang runs only in a container. The privileged image lets the bootstrap install
          # PlatformIO.
          - name: clang
            args:
              --config .qodana/clang.yaml --image jetbrains/qodana-clang:2026.2-clang18-privileged
    name: ${{ matrix.name }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up Node.js
        if: matrix.name == 'js'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Qodana scan
        uses: JetBrains/qodana-action@10be11607eb323a180e2b76b26c9c5cdceac3e77 # v2026.2.1
        with:
          args: ${{ matrix.args }}
          pr-mode: false
          artifact-name: qodana-${{ matrix.name }}
          primary-cache-key: qodana-2026.2-${{ matrix.name }}-${{ github.ref }}-${{ github.sha }}
          additional-cache-key: qodana-2026.2-${{ matrix.name }}-${{ github.ref }}
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
          QODANA_ENDPOINT: "https://qodana.cloud"
