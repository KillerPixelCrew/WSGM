# Qodana Community for C/C++ (clang-tidy) on the IR firmware. The linter reads a compilation
# database, which PlatformIO writes after it installs the ESP32-C3 toolchain and the pinned
# libraries. The linter runs only in a container; the CI job uses the privileged Clang 18 image so
# this bootstrap can install Python. PlatformIO and its downloads live in .qodana/platformio, which
# the CI job caches. The linter runs the compiler named in the database, so the bootstrap links the
# ESP32-C3 toolchain onto PATH. The Windows-only UWP bridge spike under tools/ is not analysed.
version: "1.0"
linter: qodana-clang

bootstrap: >-
  set -eu; export PLATFORMIO_CORE_DIR="$PWD/.qodana/platformio/core";
  venv="$PWD/.qodana/platformio/venv"; apt-get update && apt-get install -y --no-install-recommends
  python3-venv; [ -x "$venv/bin/pio" ] || { python3 -m venv "$venv" && "$venv/bin/pip" install
  platformio==6.2.0; }; "$venv/bin/pio" run -d src/WSGM.Plugin.Ir/Firmware -t compiledb; ln -sf
  "$PLATFORMIO_CORE_DIR"/packages/toolchain-riscv32-esp/bin/* /usr/local/bin/; mkdir -p build && cp
  src/WSGM.Plugin.Ir/Firmware/compile_commands.json build/

exclude:
  - name: All
    paths:
      - _ref
      - external
      - .qodana/platformio
      - src/WSGM.Plugin.Ir/Firmware/.pio
