# Qodana for JavaScript and TypeScript: the Steam asset build scripts, the Steam UI asset source
# and the attended CDP tools. NativeQamBootstrap.js is generated by eng/build-steam-assets.mjs, so
# its findings belong to the source it is built from.
version: "1.0"
linter: qodana-js
profile:
  name: qodana.recommended

bootstrap: npm ci --ignore-scripts --no-audit --no-fund

exclude:
  - name: All
    paths:
      - _ref
      - external
      - node_modules
      - publish
      - src/WSGM/Core/SteamUiAssets/NativeQamBootstrap.js
      - src/WSGM.Plugin.Ir/Firmware/.pio
