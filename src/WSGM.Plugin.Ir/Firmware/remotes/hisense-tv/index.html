<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hisense TV</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, sans-serif;
      }

      body {
        margin: 0;
        display: grid;
        justify-items: center;
        background: #111316;
        color: #e8eaed;
      }

      .remote {
        width: min(21rem, calc(100vw - 2rem));
        margin: 1rem 0;
        padding: 1.25rem 1rem 1.5rem;
        border-radius: 2.5rem;
        background: linear-gradient(#2a2d33, #1e2024);
        box-shadow: 0 0.75rem 2rem #0008;
      }

      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .top a {
        color: #9aa0a6;
        font-size: 0.8rem;
      }

      .brand {
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      .keys {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.5rem;
        margin-top: 0.75rem;
      }

      .keys.four {
        grid-template-columns: repeat(4, 1fr);
      }

      button {
        min-height: 2.5rem;
        border: 0;
        border-radius: 0.8rem;
        background: #3a3e45;
        color: inherit;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        touch-action: manipulation;
      }

      button:active {
        background: #555a63;
      }

      .off {
        background: #9c3129;
      }

      .on {
        background: #1f7a52;
      }

      .pad {
        display: grid;
        grid-template-columns: repeat(3, 3.5rem);
        grid-template-rows: repeat(3, 3.5rem);
        gap: 0.35rem;
        justify-content: center;
        margin: 1rem 0 0.25rem;
      }

      .pad button {
        border-radius: 50%;
      }

      .pad .ok {
        background: #1fa39a;
      }

      .rocker {
        display: grid;
        gap: 0.35rem;
        color: #9aa0a6;
        font-size: 0.75rem;
        text-align: center;
      }

      details {
        margin-top: 1rem;
        color: #9aa0a6;
        font-size: 0.85rem;
      }

      summary {
        cursor: pointer;
      }

      #status {
        min-height: 1.25rem;
        margin: 0.75rem 0 0;
        color: #9aa0a6;
        font-size: 0.8rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <main class="remote">
      <div class="top">
        <a href="../../">All remotes</a>
        <span class="brand">HISENSE</span>
      </div>

      <div class="keys">
        <button class="off" data-button="power-off">Off</button>
        <button data-button="power-toggle">Power</button>
        <button class="on" data-button="power-on">On</button>
      </div>

      <div class="keys four">
        <button data-button="hdmi-1">HDMI 1</button>
        <button data-button="hdmi-2">HDMI 2</button>
        <button data-button="hdmi-3">HDMI 3</button>
        <button data-button="hdmi-4">HDMI 4</button>
      </div>

      <div class="keys">
        <button data-button="home">Home</button>
        <button data-button="input">Input</button>
        <button data-button="menu">Menu</button>
      </div>

      <div class="pad">
        <span></span>
        <button data-button="up" aria-label="Up">&#9650;</button>
        <span></span>
        <button data-button="left" aria-label="Left">&#9664;</button>
        <button class="ok" data-button="ok">OK</button>
        <button data-button="right" aria-label="Right">&#9654;</button>
        <span></span>
        <button data-button="down" aria-label="Down">&#9660;</button>
        <span></span>
      </div>

      <div class="keys">
        <button data-button="return">Return</button>
        <button data-button="info">Info</button>
        <button data-button="exit">Exit</button>
      </div>

      <div class="keys">
        <div class="rocker">
          <button data-button="volume-up" aria-label="Volume up">+</button>
          <span>VOL</span>
          <button data-button="volume-down" aria-label="Volume down">&minus;</button>
        </div>
        <div class="rocker">
          <button data-button="tools">Tools</button>
          <button data-button="guide">Guide</button>
          <button data-button="previous-channel">Previous</button>
        </div>
        <div class="rocker">
          <button data-button="channel-up" aria-label="Channel up">+</button>
          <span>CH</span>
          <button data-button="channel-down" aria-label="Channel down">&minus;</button>
        </div>
      </div>

      <div class="keys">
        <button data-button="digit-1">1</button>
        <button data-button="digit-2">2</button>
        <button data-button="digit-3">3</button>
        <button data-button="digit-4">4</button>
        <button data-button="digit-5">5</button>
        <button data-button="digit-6">6</button>
        <button data-button="digit-7">7</button>
        <button data-button="digit-8">8</button>
        <button data-button="digit-9">9</button>
        <button data-button="dash">-</button>
        <button data-button="digit-0">0</button>
        <button data-button="enter">Enter</button>
      </div>

      <details>
        <summary>Picture, sound and sources</summary>
        <div class="keys">
          <button data-button="picture-mode">Picture</button>
          <button data-button="sound-mode">Sound</button>
          <button data-button="sleep">Sleep</button>
          <button data-button="aspect-wide">16:9</button>
          <button data-button="aspect-normal">4:3</button>
          <button data-button="aspect-cinema">Cinema</button>
          <button data-button="aspect-panorama">Panorama</button>
          <button data-button="aspect-zoom">Zoom</button>
          <button data-button="freeze">Freeze</button>
          <button data-button="channel-list">Channels</button>
          <button data-button="favorites">Favorites</button>
          <button data-button="hdmi-5">HDMI 5</button>
          <button data-button="tv-1">TV 1</button>
          <button data-button="tv-2">TV 2</button>
          <button data-button="usb">USB</button>
          <button data-button="av-1">AV 1</button>
          <button data-button="av-2">AV 2</button>
          <button data-button="av-3">AV 3</button>
          <button data-button="component-1">Comp 1</button>
          <button data-button="component-2">Comp 2</button>
          <button data-button="component-3">Comp 3</button>
          <button data-button="vga">VGA</button>
        </div>
      </details>

      <details>
        <summary>Picture in picture</summary>
        <div class="keys">
          <button data-button="pip">PIP</button>
          <button data-button="pip-input">Input</button>
          <button data-button="pip-swap">Swap</button>
          <button data-button="pip-position">Position</button>
          <button data-button="pip-size">Size</button>
        </div>
      </details>

      <p id="status" role="status"></p>
    </main>

    <script>
      const statusLine = document.getElementById("status");

      async function press(button) {
        statusLine.textContent = "Sending...";
        try {
          const response = await fetch(`buttons/${button}`, {
            method: "POST",
            headers: { "X-WSGM-IR": "1" },
          });
          const result = await response.json();
          statusLine.textContent = result.status === "transmitted" ? "" : result.status;
        } catch {
          statusLine.textContent = "Endpoint unreachable";
        }
      }

      document.addEventListener("click", (event) => {
        const key = event.target.closest("[data-button]");
        if (key) {
          press(key.dataset.button);
        }
      });
    </script>
  </body>
</html>
